<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#334155"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".12"/></filter></defs><rect width="1500" height="820" rx="30" fill="#fffdf9"/><text x="70" y="72" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#111827">Formula vs. Cask vs. Tap</text><text x="70" y="112" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#64748b">Formula and Cask describe packages. A Tap distributes those package definitions.</text><g filter="url(#s)"><rect x="555" y="155" width="390" height="105" rx="24" fill="#1f2937"/><rect x="110" y="355" width="560" height="260" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="4"/><rect x="830" y="355" width="560" height="260" rx="28" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="4"/><rect x="300" y="690" width="900" height="90" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="4"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="750" y="220" font-size="30" font-weight="700" fill="#fff">Homebrew CLI</text><text x="390" y="410" font-size="30" font-weight="700" fill="#047857">Formula</text><text x="390" y="446" font-size="20" font-weight="700" fill="#065f46">CLI tools • libraries • runtimes • services</text><text x="390" y="500" font-size="21" fill="#1f2937"><tspan x="390">Build source or pour a precompiled bottle</tspan><tspan x="390" dy="32">into a versioned keg inside the Cellar.</tspan><tspan x="390" dy="32">Link selected commands into the Homebrew prefix.</tspan></text><text x="1110" y="410" font-size="30" font-weight="700" fill="#6d28d9">Cask</text><text x="1110" y="446" font-size="20" font-weight="700" fill="#5b21b6">macOS apps • PKGs • fonts • vendor binaries</text><text x="1110" y="500" font-size="21" fill="#1f2937"><tspan x="1110">Download a DMG, ZIP, or PKG from upstream.</tspan><tspan x="1110" dy="32">Verify the checksum, then install the declared</tspan><tspan x="1110" dy="32">artifact, commonly into /Applications.</tspan></text><text x="750" y="735" font-size="28" font-weight="700" fill="#9a3412">Tap = Git repository containing Formulae, Casks, and optional brew commands</text></g><g stroke="#334155" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M750 260V300H390V345"/><path d="M750 260V300H1110V345"/><path d="M390 615V680"/><path d="M1110 615V680"/></g><g font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#475569" text-anchor="middle"><text x="390" y="648">Package definition</text><text x="1110" y="648">Package definition</text></g></svg>