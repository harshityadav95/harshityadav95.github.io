<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#334155"/></marker><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter></defs><rect width="1500" height="900" rx="30" fill="#f8fafc"/><text x="70" y="72" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#111827">How a Homebrew Cask installs a prebuilt application</text><text x="70" y="112" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#64748b">The Cask is a deployment contract; the vendor release remains the payload.</text><g filter="url(#s)"><rect x="65" y="180" width="240" height="110" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><rect x="355" y="180" width="240" height="110" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/><rect x="645" y="180" width="240" height="110" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><rect x="935" y="180" width="240" height="110" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><rect x="1225" y="180" width="210" height="110" rx="22" fill="#fdf2f8" stroke="#ec4899" stroke-width="3"/><rect x="190" y="520" width="310" height="170" rx="24" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><rect x="595" y="520" width="310" height="170" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><rect x="1000" y="520" width="310" height="170" rx="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="185" y="225" font-size="24" font-weight="700" fill="#6d28d9"><tspan x="185">1. Load Cask</tspan><tspan x="185" dy="31">definition</tspan></text><text x="475" y="225" font-size="24" font-weight="700" fill="#1d4ed8"><tspan x="475">2. Resolve URL,</tspan><tspan x="475" dy="31">version and OS</tspan></text><text x="765" y="225" font-size="24" font-weight="700" fill="#b45309"><tspan x="765">3. Download</tspan><tspan x="765" dy="31">DMG / ZIP / PKG</tspan></text><text x="1055" y="225" font-size="24" font-weight="700" fill="#047857"><tspan x="1055">4. Verify</tspan><tspan x="1055" dy="31">SHA-256</tspan></text><text x="1330" y="225" font-size="24" font-weight="700" fill="#be185d"><tspan x="1330">5. Stage in</tspan><tspan x="1330" dy="31">Caskroom</tspan></text><text x="750" y="405" font-size="29" font-weight="700" fill="#111827">Install the declared artifact</text><text x="345" y="572" font-size="27" font-weight="700" fill="#047857">`.app` artifact</text><text x="345" y="618" font-size="21" fill="#1f2937"><tspan x="345">Copy or link the app into</tspan><tspan x="345" dy="31">/Applications</tspan></text><text x="750" y="572" font-size="27" font-weight="700" fill="#c2410c">`.pkg` artifact</text><text x="750" y="618" font-size="21" fill="#1f2937"><tspan x="750">Run macOS Installer using</tspan><tspan x="750" dy="31">declared uninstall metadata</tspan></text><text x="1155" y="572" font-size="27" font-weight="700" fill="#1d4ed8">Other artifacts</text><text x="1155" y="618" font-size="21" fill="#1f2937"><tspan x="1155">Link a binary, install a font,</tspan><tspan x="1155" dy="31">plugin, helper, or preference pane</tspan></text><text x="750" y="785" font-size="22" font-weight="700" fill="#475569">Homebrew installs the package. macOS Gatekeeper separately decides whether the application may execute.</text></g><g stroke="#334155" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M305 235H345"/><path d="M595 235H635"/><path d="M885 235H925"/><path d="M1175 235H1215"/><path d="M1330 290V350H750V440"/><path d="M750 440V480H345V510"/><path d="M750 480V510"/><path d="M750 480H1155V510"/></g></svg>