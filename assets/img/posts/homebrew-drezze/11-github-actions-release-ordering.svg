<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#334155"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".11"/></filter></defs><rect width="1700" height="980" rx="32" fill="#f8fafc"/><text x="65" y="72" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#111827">GitHub Actions release ordering: the Tap update must be last</text><text x="65" y="112" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#64748b">Each stage is a gate. Publication proceeds only after the previous artifact and proof are valid.</text><g filter="url(#s)" font-family="Arial,Helvetica,sans-serif"><rect x="60" y="170" width="360" height="110" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/><rect x="475" y="170" width="360" height="110" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/><rect x="890" y="170" width="360" height="110" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><rect x="1305" y="170" width="330" height="110" rx="22" fill="#fdf2f8" stroke="#ec4899" stroke-width="3"/><rect x="1305" y="385" width="330" height="110" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><rect x="890" y="385" width="360" height="110" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><rect x="475" y="385" width="360" height="110" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><rect x="60" y="385" width="360" height="110" rx="22" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/><rect x="60" y="600" width="360" height="110" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><rect x="475" y="600" width="360" height="110" rx="22" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/><rect x="890" y="600" width="360" height="110" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><rect x="1305" y="600" width="330" height="110" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><rect x="1060" y="820" width="575" height="105" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#111827" font-size="23" font-weight="700"><text x="240" y="212"><tspan x="240">1. Validate tag and</tspan><tspan x="240" dy="31">project version</tspan></text><text x="655" y="225">2. Build release</text><text x="1070" y="225">3. Sign application</text><text x="1470" y="212"><tspan x="1470">4. Verify signature</tspan><tspan x="1470" dy="31">and architectures</tspan></text><text x="1470" y="427"><tspan x="1470">5. Notarize and</tspan><tspan x="1470" dy="31">staple application</tspan></text><text x="1070" y="427"><tspan x="1070">6. Package and</tspan><tspan x="1070" dy="31">sign final DMG</tspan></text><text x="655" y="427"><tspan x="655">7. Notarize, staple,</tspan><tspan x="655" dy="31">and verify DMG</tspan></text><text x="240" y="427"><tspan x="240">8. Compute final</tspan><tspan x="240" dy="31">checksums</tspan></text><text x="240" y="642"><tspan x="240">9. Publish public</tspan><tspan x="240" dy="31">release assets</tspan></text><text x="655" y="642"><tspan x="655">10. Update public</tspan><tspan x="655" dy="31">release metadata</tspan></text><text x="1070" y="642"><tspan x="1070">11. Generate and push</tspan><tspan x="1070" dy="31">the Homebrew Cask</tspan></text><text x="1470" y="642"><tspan x="1470">12. Run Tap style</tspan><tspan x="1470" dy="31">and strict audits</tspan></text><text x="1348" y="862" font-size="24" fill="#991b1b"><tspan x="1348">Public Tap update comes only after</tspan><tspan x="1348" dy="34">the release URL and checksum are valid.</tspan></text></g><g stroke="#334155" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M420 225H465"/><path d="M835 225H880"/><path d="M1250 225H1295"/><path d="M1470 280V375"/><path d="M1305 440H1260"/><path d="M890 440H845"/><path d="M475 440H430"/><path d="M240 495V590"/><path d="M420 655H465"/><path d="M835 655H880"/><path d="M1250 655H1295"/><path d="M1470 710V810"/></g><text x="580" y="880" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#475569">Failure before publication leaves the Tap unchanged; users never receive a manifest for a missing or unverified asset.</text></svg>